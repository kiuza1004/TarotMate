<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TarotMate — Card Preview</title>
<style>
  :root {
    --bg-deep: #0f0720;
    --bg-mid: #1a0e36;
    --accent-gold: #d8a84a;
    --accent-gold-light: #f3dc8a;
    --accent-gold-dim: #a4801e;
    --accent-gold-deep: #5a3f12;
    --text-main: #f4f0fa;
    --parchment-ink: #1b0f06;
    --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-hard: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--bg-mid) 0%, var(--bg-deep) 100%);
    color: var(--text-main);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 20px;
  }
  h1 { margin: 0; font-size: 18px; color: var(--accent-gold-light); letter-spacing: 0.1em; }
  p.note { margin: 0; font-size: 12px; opacity: 0.7; text-align: center; max-width: 340px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .stage label { font-size: 11px; color: var(--accent-gold); letter-spacing: 0.18em; }

  /* ====== Card styles — container-query scaling (cqw) ====== */
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3.4;
    border-radius: 10px;
    perspective: 800px;
    container-type: inline-size;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .card-front {
    background: #fbf6e6;
    border: 1px solid var(--accent-gold-deep);
    color: var(--parchment-ink);
    box-shadow:
      var(--shadow-hard),
      inset 0 0 0 1px var(--accent-gold-light),
      inset 0 0 0 2px var(--accent-gold-dim),
      inset 0 0 0 3px #fbf6e6,
      inset 0 0 0 4px var(--accent-gold-deep);
  }
  .card-front::before {
    content: "";
    position: absolute;
    inset: 5cqw;
    border: 0.4cqw solid var(--accent-gold-dim);
    border-radius: 2cqw;
    pointer-events: none;
    z-index: 1;
  }
  .card-front .corn-orn {
    position: absolute;
    width: 7cqw;
    height: 7cqw;
    z-index: 4;
    pointer-events: none;
    opacity: 0.85;
  }
  .card-front .corn-orn.tl { top: 2cqw;    left: 2cqw; }
  .card-front .corn-orn.tr { top: 2cqw;    right: 2cqw;   transform: scaleX(-1); }
  .card-front .corn-orn.bl { bottom: 2cqw; left: 2cqw;    transform: scaleY(-1); }
  .card-front .corn-orn.br { bottom: 2cqw; right: 2cqw;   transform: scale(-1, -1); }

  .card-front-content {
    position: absolute;
    inset: 9cqw 7cqw 6cqw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    z-index: 2;
  }
  .card-front .num-banner {
    position: relative;
    font-family: "Cinzel", "Times New Roman", "Noto Serif KR", serif;
    font-size: 8cqw;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #1a0f06;
    padding: 0.5cqw 10cqw 1cqw;
    min-width: 20cqw;
  }
  .card-front .num-banner::before,
  .card-front .num-banner::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 4cqw;
    height: 0.4cqw;
    background: #1a0f06;
    transform: translateY(-50%);
    opacity: 0.6;
  }
  .card-front .num-banner::before { left: -1.5cqw; }
  .card-front .num-banner::after  { right: -1.5cqw; }

  .scene {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    margin: 5px 0 6px;
    padding: 2px;
    background: #fbf6e6;
    border: 0.5px solid #1a0f06;
    box-shadow:
      0 0 0 1px #fbf6e6,
      0 0 0 1.5px rgba(140, 100, 30, 0.6),
      0 1px 2px rgba(0, 0, 0, 0.18);
    border-radius: 1px;
  }
  .scene-svg { width: 100%; height: 100%; display: block; }

  .card-front .name-banner {
    position: relative;
    flex-shrink: 0;
    width: 100%;
    padding: 2.5cqw 2.5cqw 3cqw;
    border-top: 0.4cqw solid rgba(26, 15, 6, 0.4);
    border-bottom: 0.4cqw solid rgba(26, 15, 6, 0.4);
    overflow: visible;
  }
  .card-front .name {
    font-family: "Cinzel", "Times New Roman", "Noto Serif KR", serif;
    font-size: 8cqw;
    font-weight: 700;
    line-height: 1.2;
    color: #1a0f06;
    letter-spacing: 0.02em;
    word-break: keep-all;
  }
  .card-front .name-en {
    display: block;
    font-size: 6cqw;
    font-weight: 600;
    color: #1a0f06;
    margin-top: 1.5cqw;
    line-height: 1.2;
    letter-spacing: 0.01em;
    opacity: 0.9;
    text-transform: uppercase;
    word-break: keep-all;
    overflow-wrap: anywhere;
    max-width: 100%;
  }

  /* stage sizes — small (deck/result), medium */
  .stage.small  { width: 110px; }
  .stage.medium { width: 140px; }
  .stage.large  { width: 200px; }
</style>
</head>
