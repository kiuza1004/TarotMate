<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a0b2e" />
<meta name="description" content="Rider-Waite 정통 78장 모바일 타로 리딩. 메이저·마이너 전체 덱, 정·역방향 점괘, 종합 해석." />
<title>TarotMate - 실시간 타로점</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TarotMate" />
<meta name="application-name" content="TarotMate" />
<style>
  :root {
    --bg-deep: #0f0720;
    --bg-mid: #1a0b2e;
    --bg-soft: #2a1648;
    --accent-gold: #d8a84a;       /* luxe burnished gold */
    --accent-gold-light: #f3dc8a; /* gold leaf highlight */
    --accent-gold-dim: #a4801e;   /* deep antique gold */
    --accent-gold-deep: #5a3f12;  /* dark sepia-gold */
    --accent-purple: #8a5cf6;
    --text-main: #f4f0fa;
    --text-sub: #b9a8d4;
    --card-back-1: #2a1c4a;
    --card-back-2: #0c0a18;
    --card-face-1: #fbf2d2;       /* luminous Rider-Waite cream */
    --card-face-2: #f1d878;       /* RW classic yellow */
    --card-face-3: #c69c3a;       /* deep saffron */
    --parchment-ink: #1b0f06;     /* deep ink */
    --danger: #e07a5f;
    --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-hard: 0 12px 32px rgba(0, 0, 0, 0.55);
    --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(138, 92, 246, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 90%, rgba(245, 208, 97, 0.10) 0%, transparent 60%),
      radial-gradient(ellipse at top, var(--bg-mid) 0%, var(--bg-deep) 100%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ===== Header ===== */
  .header {
    text-align: center;
    padding: 8px 0 4px;
  }
  .header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--accent-gold) 0%, #ede0a8 50%, var(--accent-gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--text-sub);
    letter-spacing: 0.08em;
  }

  /* ===== Screen ===== */
  .screen {
    display: none;
    flex-direction: column;
    gap: 20px;
    flex: 1;
  }
  .screen.active {
    display: flex;
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Intro Screen ===== */
  .intro-box {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(245, 208, 97, 0.18);
    border-radius: 16px;
    padding: 22px 18px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .intro-box label {
    font-size: 14px;
    color: var(--text-sub);
    letter-spacing: 0.04em;
  }
  .intro-box textarea {
    width: 100%;
    min-height: 90px;
    resize: none;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(245, 208, 97, 0.25);
    border-radius: 10px;
    color: var(--text-main);
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    outline: none;
    transition: border-color var(--transition);
  }
  .intro-box textarea:focus {
    border-color: var(--accent-gold);
  }
  .intro-box textarea::placeholder {
    color: rgba(185, 168, 212, 0.5);
  }

  /* Deck mode selector */
  .mode-select {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .mode-btn {
    padding: 10px 4px 8px;
    border: 1px solid var(--accent-gold-dim);
    background: linear-gradient(180deg, rgba(60, 40, 18, 0.55), rgba(20, 12, 6, 0.7));
    color: var(--accent-gold-light);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
    line-height: 1.1;
  }
  .mode-btn:hover { border-color: var(--accent-gold); }
  .mode-btn small {
    display: block;
    font-size: 9.5px;
    opacity: 0.78;
    margin-top: 3px;
    font-weight: 500;
    letter-spacing: 0.08em;
  }
  .mode-btn.active {
    background: linear-gradient(180deg, var(--accent-gold-light) 0%, var(--accent-gold) 55%, var(--accent-gold-dim) 100%);
    color: var(--parchment-ink);
    border-color: var(--accent-gold-deep);
    box-shadow:
      inset 0 1px 0 rgba(255, 250, 220, 0.9),
      inset 0 -1px 0 rgba(90, 63, 18, 0.45),
      0 2px 6px rgba(0, 0, 0, 0.45);
    text-shadow: 0 1px 0 rgba(255, 245, 200, 0.6);
  }
  .mode-btn.active small { opacity: 0.95; }
  .mode-desc {
    font-size: 11.5px;
    color: var(--text-sub);
    line-height: 1.55;
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.25);
    border-left: 2px solid var(--accent-gold-dim);
    border-radius: 4px;
  }

  .btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dim) 100%);
    color: #2a1648;
    box-shadow: 0 6px 18px rgba(245, 208, 97, 0.3);
  }
  .btn-primary:active {
    transform: translateY(2px);
    box-shadow: 0 3px 10px rgba(245, 208, 97, 0.25);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid rgba(245, 208, 97, 0.3);
  }
  .btn-secondary:active {
    background: rgba(255, 255, 255, 0.12);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ===== Shuffle / Pick Screen ===== */
  .question-display {
    text-align: center;
    font-size: 14px;
    color: var(--text-sub);
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    border-left: 3px solid var(--accent-gold);
    line-height: 1.5;
    word-break: keep-all;
  }

  .pick-info {
    text-align: center;
    font-size: 15px;
    color: var(--accent-gold);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .pick-info .count {
    color: var(--text-main);
    font-size: 18px;
  }

  .deck-area {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px 0;
    align-content: start;
  }

  /* ===== Card (shared) ===== */
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3.4;
    border-radius: 10px;
    cursor: pointer;
    transition: transform var(--transition), opacity var(--transition);
    perspective: 800px;
    container-type: inline-size;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* ===== Card Back (Premium Brocade) ===== */
  .card-back {
    background:
      /* damask brocade — antique gold thread */
      repeating-linear-gradient(45deg, rgba(184, 146, 72, 0.06) 0 1px, transparent 1px 12px),
      repeating-linear-gradient(-45deg, rgba(184, 146, 72, 0.06) 0 1px, transparent 1px 12px),
      /* candle-warm center halo */
      radial-gradient(ellipse at 50% 50%, rgba(184, 146, 72, 0.25) 0%, transparent 65%),
      /* vignette */
      radial-gradient(circle at 50% 50%, transparent 50%, rgba(0, 0, 0, 0.55) 100%),
      /* base deep indigo (lampblack + bistre) */
      linear-gradient(135deg, #1c1830 0%, #100c20 60%, #060410 100%);
    border: 1px solid var(--accent-gold-dim);
    box-shadow:
      var(--shadow-soft),
      inset 0 0 0 3px rgba(6, 4, 16, 0.75),
      inset 0 0 0 4px rgba(184, 146, 72, 0.5),
      inset 0 0 24px rgba(0, 0, 0, 0.7);
  }
  .card-back::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(184, 146, 72, 0.45);
    border-radius: 6px;
    pointer-events: none;
  }
  .card-back::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(184, 146, 72, 0.2);
    border-radius: 4px;
    pointer-events: none;
  }
  .card-back .back-svg {
    position: absolute;
    inset: 14px;
    width: calc(100% - 28px);
    height: calc(100% - 28px);
    pointer-events: none;
  }
  .card-back .back-pulse {
    transform-origin: center;
    transform-box: fill-box;
    animation: pulseStar 4.5s ease-in-out infinite;
  }
  /* candlelit shimmer — gentler than goldleaf flicker */
  @keyframes pulseStar {
    0%, 100% { opacity: 0.88; transform: scale(1);    filter: drop-shadow(0 0 2px rgba(184, 146, 72, 0.4)); }
    50%      { opacity: 1;    transform: scale(1.04); filter: drop-shadow(0 0 6px rgba(184, 146, 72, 0.8)); }
  }

  /* ===== Card Front (Classic Rider-Waite, clean white matte) ===== */
  .card-front {
    background: #fbf6e6;                /* clean ivory / aged-paper white */
    border: 1px solid var(--accent-gold-deep);
    transform: rotateY(180deg);
    color: var(--parchment-ink);
    box-shadow:
      var(--shadow-hard),
      inset 0 0 0 1px var(--accent-gold-light),
      inset 0 0 0 2px var(--accent-gold-dim),
      inset 0 0 0 3px #fbf6e6,
      inset 0 0 0 4px var(--accent-gold-deep);
  }
  /* inner hairline gilt frame */
  .card-front::before {
    content: "";
    position: absolute;
    inset: 5cqw;
    border: 0.4cqw solid var(--accent-gold-dim);
    border-radius: 2cqw;
    pointer-events: none;
  }
  .card-front::after { content: none; }

  /* SVG corner cartouches — tiny, discreet */
  .card-front .corn-orn {
    position: absolute;
    width: 7cqw;
    height: 7cqw;
    z-index: 4;
    pointer-events: none;
    opacity: 0.85;
  }
  .card-front .corn-orn.tl { top: 2cqw;    left: 2cqw; }
  .card-front .corn-orn.tr { top: 2cqw;    right: 2cqw;   transform: scaleX(-1); }
  .card-front .corn-orn.bl { bottom: 2cqw; left: 2cqw;    transform: scaleY(-1); }
  .card-front .corn-orn.br { bottom: 2cqw; right: 2cqw;   transform: scale(-1, -1); }

  .card-front-content {
    position: absolute;
    /* Grid with fixed name slot — guarantees bottom never clips */
    inset: 6cqw 6cqw 3cqw;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 2cqw;
    justify-items: center;
    text-align: center;
    z-index: 2;
  }
  /* Reversed cards are still distinguished by (역) tag + flipped reading text,
     but visually they always display upright. */

  /* Roman numeral — classic RW top label, clean caps */
  .card-front .num-banner {
    position: relative;
    font-family: "Cinzel", "Times New Roman", "Noto Serif KR", serif;
    font-size: 8cqw;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #1a0f06;
    padding: 0.5cqw 0 1cqw;
    background: transparent;
    border: none;
    width: max-content;
  }
  .card-front .num-banner::before,
  .card-front .num-banner::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 4cqw;
    height: 0.4cqw;
    background: #1a0f06;
    transform: translateY(-50%);
    opacity: 0.6;
  }
  .card-front .num-banner::before { left: -5cqw; }
  .card-front .num-banner::after  { right: -5cqw; }

  /* Scene SVG panel — framed in a clean off-white matte */
  .scene {
    position: relative;
    width: 100%;
    min-height: 0;          /* allow grid 1fr to shrink */
    display: flex;
    padding: 2px;
    background: #fbf6e6;
    border: 0.5px solid #1a0f06;
    box-shadow:
      0 0 0 1px #fbf6e6,
      0 0 0 1.5px rgba(140, 100, 30, 0.6),
      0 1px 2px rgba(0, 0, 0, 0.18);
    border-radius: 1px;
  }
  .scene-svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 0;
  }

  /* Name banner — classic RW caps under illustration */
  .card-front .name-banner {
    position: relative;
    width: 100%;
    /* Reserved slot — fits Korean + up to 2 lines EN + 2-line bottom buffer */
    min-height: 36cqw;
    padding: 2.5cqw 1.5cqw 14cqw;
    background: transparent;
    border: none;
    border-top: 0.4cqw solid rgba(26, 15, 6, 0.4);
    border-bottom: 0.4cqw solid rgba(26, 15, 6, 0.4);
    border-radius: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .card-front .name-banner::before,
  .card-front .name-banner::after {
    content: none;
  }
  .card-front .name-banner::before { display: none; }
  .card-front .name-banner::after  { display: none; }
  .card-front .name {
    font-family: "Cinzel", "Times New Roman", "Noto Serif KR", serif;
    font-size: 8cqw;
    font-weight: 700;
    line-height: 1.2;
    color: #1a0f06;
    letter-spacing: 0.02em;
    word-break: keep-all;
    text-transform: none;
  }
  .card-front .name-en {
    display: block;
    font-size: 6cqw;
    font-weight: 600;
    font-style: normal;
    color: #1a0f06;
    margin-top: 1.5cqw;
    line-height: 1.2;
    letter-spacing: 0.01em;
    opacity: 0.9;
    text-transform: uppercase;
    word-break: break-word;
    overflow-wrap: anywhere;
    max-width: 100%;
  }

  /* Deck card states */
  .deck-area .card.shuffling {
    animation: shuffleIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes shuffleIn {
    0%   { transform: translateY(-30px) rotate(var(--rot, 0deg)); opacity: 0; }
    100% { transform: translateY(0) rotate(0); opacity: 1; }
  }
  .deck-area .card.picked {
    transform: translateY(-4px) scale(0.97);
    filter: drop-shadow(0 6px 14px rgba(245, 208, 97, 0.35));
  }
  .deck-area .card.picked .card-back {
    border-color: var(--accent-gold);
    box-shadow:
      0 0 0 2px var(--accent-gold),
      inset 0 0 0 3px rgba(6, 4, 16, 0.75),
      inset 0 0 0 4px rgba(245, 208, 97, 0.85),
      inset 0 0 24px rgba(0, 0, 0, 0.7),
      0 0 18px rgba(245, 208, 97, 0.4);
  }
  .deck-area .card:active {
    transform: scale(0.95);
  }
  .pick-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-gold-light) 0%, var(--accent-gold) 55%, var(--accent-gold-dim) 100%);
    color: var(--parchment-ink);
    font-weight: 800;
    font-size: 13px;
    font-family: "Cinzel", "Times New Roman", "Noto Serif KR", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--bg-deep);
    box-shadow:
      0 2px 6px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 250, 220, 0.8);
    z-index: 6;
    pointer-events: none;
    animation: pickBadgePop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pickBadgePop {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .pick-hint {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
    font-weight: 400;
    word-break: keep-all;
    line-height: 1.5;
  }

  .pick-actions {
    position: sticky;
    top: 0;
    margin-bottom: 4px;
    padding: 6px 0 12px;
    background:
      linear-gradient(to bottom,
        var(--bg-deep) 0%,
        var(--bg-deep) 55%,
        rgba(15, 7, 32, 0.85) 80%,
        transparent 100%);
    z-index: 10;
  }
  #btn-confirm-pick {
    transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
  }
  #btn-confirm-pick:disabled {
    opacity: 0.42;
    cursor: not-allowed;
    box-shadow: none;
  }
  #btn-confirm-pick.ready {
    animation: confirmReady 1.8s ease-in-out infinite;
  }
  @keyframes confirmReady {
    0%, 100% { box-shadow: 0 6px 18px rgba(245, 208, 97, 0.3); }
    50%      { box-shadow: 0 8px 26px rgba(245, 208, 97, 0.55); }
  }

  /* ===== Result Screen ===== */
  .result-area {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .result-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .result-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .result-slot .position-label {
    font-size: 11px;
    color: var(--accent-gold);
    font-weight: 700;
    letter-spacing: 0.18em;
    padding: 3px 10px;
    background: rgba(245, 208, 97, 0.1);
    border-radius: 10px;
    border: 1px solid rgba(245, 208, 97, 0.2);
  }
  .result-slot .card {
    width: 100%;
  }

  .interpret-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .interpret-card {
    position: relative;
    background:
      linear-gradient(160deg, rgba(255, 255, 255, 0.05) 0%, rgba(138, 92, 246, 0.08) 100%);
    border: 1px solid rgba(245, 208, 97, 0.22);
    border-radius: 14px;
    padding: 18px 16px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  }
  .interpret-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  }
  .interpret-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .interpret-card .pos-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .interpret-card .pos {
    font-size: 11px;
    color: var(--accent-gold);
    font-weight: 700;
    letter-spacing: 0.18em;
    padding: 3px 10px;
    background: rgba(245, 208, 97, 0.12);
    border-radius: 10px;
  }
  .interpret-card .orient {
    display: inline-block;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .interpret-card .orient.upright {
    background: rgba(138, 92, 246, 0.25);
    color: #c4b3fc;
  }
  .interpret-card .orient.reversed {
    background: rgba(224, 122, 95, 0.25);
    color: #f0b6a3;
  }
  .interpret-card .card-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 2px;
    letter-spacing: 0.02em;
  }
  .interpret-card .card-name-en {
    font-size: 12px;
    color: var(--text-sub);
    font-style: italic;
    margin-bottom: 12px;
  }
  .interpret-card .keywords {
    font-size: 12.5px;
    color: var(--accent-gold);
    margin-bottom: 12px;
    padding: 8px 11px;
    background: rgba(245, 208, 97, 0.06);
    border-radius: 8px;
    border-left: 2px solid var(--accent-gold-dim);
    word-break: keep-all;
    letter-spacing: 0.02em;
    line-height: 1.5;
  }
  .interpret-card .lead {
    font-size: 12.5px;
    color: var(--text-sub);
    margin-bottom: 6px;
    font-style: italic;
    word-break: keep-all;
  }
  .interpret-card .prophecy {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--text-main);
    word-break: keep-all;
  }

  /* ===== Overall Prophecy ===== */
  .overall-prophecy {
    position: relative;
    background:
      radial-gradient(circle at 50% 0%, rgba(245, 208, 97, 0.18) 0%, transparent 55%),
      linear-gradient(160deg, rgba(74, 29, 138, 0.45) 0%, rgba(26, 11, 46, 0.7) 100%);
    border: 1px solid rgba(245, 208, 97, 0.4);
    border-radius: 16px;
    padding: 22px 18px 20px;
    box-shadow: var(--shadow-hard), inset 0 0 24px rgba(138, 92, 246, 0.1);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  }
  .overall-prophecy.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .overall-prophecy .crown {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--accent-gold);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .overall-prophecy .summary-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-gold) 0%, #ede0a8 50%, var(--accent-gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .overall-prophecy .summary-body {
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--text-main);
    word-break: keep-all;
    text-align: center;
  }
  .overall-prophecy .advice {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed rgba(245, 208, 97, 0.28);
    font-size: 13px;
    line-height: 1.75;
    color: var(--text-sub);
    word-break: keep-all;
    text-align: center;
  }
  .overall-prophecy .advice strong {
    color: var(--accent-gold);
    letter-spacing: 0.04em;
  }

  .reset-area {
    margin-top: 8px;
  }

  /* Small screen adjustments — card internals now scale via cqw (container queries) */
  @media (max-width: 400px) {
    .app { padding: 20px 12px 36px; gap: 16px; }
    .deck-area { grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .pick-info { font-size: 14px; }
    .pick-info .count { font-size: 16px; }
    .pick-hint { font-size: 11.5px; }
    .pick-badge { width: 20px; height: 20px; font-size: 11.5px; }
    .result-cards { gap: 8px; }
    .result-slot .position-label { font-size: 10px; letter-spacing: 0.14em; padding: 3px 8px; }
  }

  @media (max-width: 340px) {
    .header h1 { font-size: 22px; }
    .header p { font-size: 12px; }
    .deck-area { gap: 6px; }
    .pick-hint { font-size: 11px; }
    .pick-badge { width: 18px; height: 18px; font-size: 10.5px; border-width: 1px; }
    .interpret-card { padding: 14px 12px; }
    .interpret-card .card-name { font-size: 16px; }
    .interpret-card .prophecy { font-size: 13.5px; line-height: 1.7; }
    .overall-prophecy { padding: 18px 14px 16px; }
    .overall-prophecy .summary-title { font-size: 16px; }
    .overall-prophecy .summary-body { font-size: 13.5px; }
  }
</style>
</head>
<body>

      <g fill="url(#goldVert)" stroke="#3e2a1a" stroke-width="0.15">

      <circle r="27" fill="none" stroke="#8a6a28" stroke-width="0.5" opacity="0.85"/>

      <!-- inner geometric circle -->
      <circle r="14" fill="none" stroke="#8a6a28" stroke-width="0.4" opacity="0.85"/>

      <g stroke="#b89248" stroke-width="0.35" opacity="0.6">

        <line x1="0" y1="-26" x2="0" y2="26"/>

      <g fill="#b89248">

        <circle cx="27"  cy="0"   r="0.9"/>
        <circle cx="0"   cy="27"  r="0.9"/>

        <circle cx="-19" cy="19"  r="0.6"/>
        <circle cx="-19" cy="-19" r="0.6"/>

      <g class="back-pulse">
        <g fill="url(#goldVert)" opacity="0.92" stroke="#3e2a1a" stroke-width="0.15">
          <ellipse cx="0" cy="-6.5" rx="3" ry="4.5"/>
          <ellipse cx="5.63" cy="-3.25" rx="3" ry="4.5" transform="rotate(60 5.63 -3.25)"/>
          <ellipse cx="5.63" cy="3.25" rx="3" ry="4.5" transform="rotate(120 5.63 3.25)"/>

          <ellipse cx="-5.63" cy="3.25" rx="3" ry="4.5" transform="rotate(60 -5.63 3.25)"/>
          <ellipse cx="-5.63" cy="-3.25" rx="3" ry="4.5" transform="rotate(120 -5.63 -3.25)"/>
        </g>
        <circle r="3.2" fill="#3e2a1a"/>
        <circle r="2.2" fill="url(#goldVert)"/>
        <circle r="1" fill="#ede0c4"/>
      </g>
    </symbol>

    <!-- ===== Minor Arcana suit emblems ===== -->
    <symbol id="emblemWand" viewBox="-10 -16 20 32">
      <line x1="0" y1="14" x2="0" y2="-10" stroke="#7a4818" stroke-width="2.4" stroke-linecap="round"/>

<div class="app">
  <header class="header">
    <h1>TarotMate</h1>
    <p>오늘의 운명을 묻다</p>
  </header>

  <!-- ============ INTRO SCREEN ============ -->
  <section class="screen active" id="screen-intro">
    <div class="intro-box">
      <label for="question-input">무엇이 궁금하신가요?</label>
      <textarea
        id="question-input"
        placeholder="예) 이번 달 나의 연애운은 어떨까요?"
        maxlength="200"></textarea>

      <div>
        <label style="display:block;margin-bottom:6px;">덱 선택</label>
        <div class="mode-select" id="mode-select">
          <button type="button" class="mode-btn active" data-mode="major">메이저<small>22장</small></button>
          <button type="button" class="mode-btn" data-mode="minor">마이너<small>56장</small></button>
          <button type="button" class="mode-btn" data-mode="all">전체<small>78장</small></button>
        </div>
        <div class="mode-desc" id="mode-desc">
          <strong>메이저 아르카나</strong> — 인생의 큰 흐름과 운명의 굵직한 줄기를 비춥니다.
        </div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-start">타로 리딩 시작</button>
  </section>

  <!-- ============ PICK SCREEN ============ -->
  <section class="screen" id="screen-pick">
    <div class="question-display" id="question-echo"></div>
    <div class="pick-info">
      카드 <span class="count" id="pick-count">0</span> / 3
      <div class="pick-hint">
        카드 3장을 순서대로 선택하세요 · 다시 누르면 취소됩니다
      </div>
    </div>
    <div class="pick-actions">
      <button class="btn btn-primary" id="btn-confirm-pick" disabled>운명을 펼치기</button>
    </div>
    <div class="deck-area" id="deck-area"></div>
  </section>

  <!-- ============ RESULT SCREEN ============ -->
  <section class="screen" id="screen-result">
    <div class="question-display" id="question-echo-2"></div>
    <div class="result-area">
      <div class="result-cards" id="result-cards"></div>
      <div class="interpret-list" id="interpret-list"></div>
      <div class="overall-prophecy" id="overall-prophecy" hidden>
        <div class="crown">✦ 종합 점괘 ✦</div>
        <div class="summary-title" id="overall-title"></div>
        <div class="summary-body" id="overall-body"></div>
        <div class="advice" id="overall-advice"></div>
      </div>
      <div class="reset-area">
        <button class="btn btn-secondary" id="btn-reset">다시 점 보기</button>
      </div>
    </div>
  </section>
</div>

<script>

  // RNG: cryptographically strong; falls back to Math.random if needed
  const RNG = {
    _buf(n) {
      const b = new Uint32Array(n);
      if (typeof crypto !== "undefined" && crypto.getRandomValues) crypto.getRandomValues(b);
      else for (let i = 0; i < n; i++) b[i] = (Math.random() * 0x100000000) >>> 0;
      return b;
    },
    int(maxExcl) { return this._buf(1)[0] % maxExcl; },
    pick(arr)    { return arr[this.int(arr.length)]; },
    chance(p)    { return this._buf(1)[0] / 0x100000000 < p; },
    shuffle(arr) {
      const a = [...arr], r = this._buf(a.length);
      for (let i = a.length - 1; i > 0; i--) {
        const j = r[i] % (i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  };

  // Reading history (localStorage) — prevents recent repeats
  const HISTORY = {
    KEY: "tarotmate.history.v1",
    MAX: 16,
    load() { try { return JSON.parse(localStorage.getItem(this.KEY) || "[]"); } catch { return []; } },
    save(a) { try { localStorage.setItem(this.KEY, JSON.stringify(a.slice(-this.MAX))); } catch {} },
    push(h) { const a = this.load(); a.push(h); this.save(a); },
    has(h)  { return this.load().includes(h); },
    hashOf(triad) {
      return triad.map(r => `${r.card.num}.${r.card.suit || "M"}.${r.isReversed ? "R" : "U"}`).join("~");
    }
  };

  // Triad builder — picks orientations with reroll for freshness, ≈35% reversed.
  // Cards lacking reversed copy (e.g. current minor arcana stubs) stay upright.
  function buildTriad(pickIndices) {
    const canReverse = (c) => !!(c.reversedStory && c.reversed);
    let triad = null;
    for (let attempt = 0; attempt < 6; attempt++) {
      triad = pickIndices.map(idx => {
        const card = state.shuffledDeck[idx];
        return { card, isReversed: canReverse(card) && RNG.chance(0.35) };
      });
      if (!HISTORY.has(HISTORY.hashOf(triad))) break;
    }
    HISTORY.push(HISTORY.hashOf(triad));
    return triad;
  }

  function elementOf(card) {

  function rankNum(r) {

  function analyzeTriad(triad) {
    const majors = triad.filter(r => !r.card.suit).length;
    const minors = 3 - majors;
    const reversed = triad.filter(r => r.isReversed).length;
    const suits = { w:0, c:0, s:0, p:0 };
    triad.forEach(r => { if (r.card.suit) suits[r.card.suit]++; });
    const elements = { fire:suits.w, water:suits.c, air:suits.s, earth:suits.p, ether:majors };
    const dominantElement = Object.entries(elements).sort((a,b)=>b[1]-a[1])[0][0];
    const sum = triad.reduce((s, r) => s + rankNum(r), 0);
    const lifePath = ((sum - 1) % 9) + 1;
    const courtCount = triad.filter(r => r.card.suit && ["P","N","Q","K"].includes(r.card.rank)).length;
    return { majors, minors, reversed, suits, elements, dominantElement, sum, lifePath, courtCount };
  }

  // Compose past→present→future narrative arc
  function composeArc(triad) {
    const [p, c, f] = triad;
    const named = r => `<strong>${r.card.name}${r.isReversed ? "(역)" : ""}</strong>`;
    const story = r => (r.isReversed ? r.card.reversedStory : r.card.uprightStory)
                        .split(". ")[0].replace(/\.?$/, "") + ".";
    const conn1 = p.isReversed === c.isReversed ? RNG.pick(CONNECTORS_SAME) : RNG.pick(CONNECTORS_FLIP);
    const conn2 = c.isReversed === f.isReversed ? RNG.pick(CONNECTORS_SAME) : RNG.pick(CONNECTORS_FLIP);
    return (
      `과거의 자리에는 ${named(p)}이(가) 놓여 있습니다. ${story(p)} ${conn1}<br><br>` +
      `현재의 자리에서 ${named(c)}이(가) 그 결을 받습니다. ${story(c)} ${conn2}<br><br>` +
      `미래의 자리에는 ${named(f)}이(가) 기다리고 있습니다. ${story(f)}`
    );
  }

    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {

      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

    btn.addEventListener("click", () => {
      document.querySelectorAll("#mode-select .mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.mode = btn.dataset.mode;
      $("#mode-desc").innerHTML = MODE_DESC[state.mode];
    });
  });

  $("#btn-start").addEventListener("click", () => {
    const q = $("#question-input").value.trim();
    state.question = q || "오늘 나의 흐름은 어떤가요?";
    startPickScreen();
  });

  // ============================================
  // 7. SCREEN: PICK
  // ============================================
  function startPickScreen() {
    $("#question-echo").textContent = "Q. " + state.question;

    state.shuffledDeck = shuffle(getActiveDeck());
    state.picked = [];
    state.results = [];
    updatePickCount();

    const deckArea = $("#deck-area");
    deckArea.innerHTML = "";

    state.shuffledDeck.forEach((card, idx) => {
      const cardEl = buildCardEl({ card: null, flipped: false });
      cardEl.classList.add("shuffling");
      cardEl.style.setProperty("--rot", (Math.random() * 16 - 8) + "deg");
      cardEl.style.animationDelay = (idx * 0.04) + "s";
      cardEl.dataset.idx = idx;
      cardEl.addEventListener("click", () => onPickCard(idx, cardEl));
      deckArea.appendChild(cardEl);
    });

    showScreen("pick");
  }

  function onPickCard(idx, el) {
    const selectedAt = state.picked.indexOf(idx);

    if (selectedAt !== -1) {
      // 이미 선택된 카드 → 취소
      state.picked.splice(selectedAt, 1);
      el.classList.remove("picked");
      const badge = el.querySelector(".pick-badge");
      if (badge) badge.remove();
      refreshPickBadges();
    } else {
      // 새 선택. 3장 다 찼으면 무시
      if (state.picked.length >= 3) return;
      state.picked.push(idx);
      el.classList.add("picked");
      setPickBadge(el, state.picked.length);
    }
    updatePickCount();
  }

  function setPickBadge(el, order) {
    let badge = el.querySelector(".pick-badge");
    if (!badge) {
      badge = document.createElement("div");
      badge.className = "pick-badge";
      el.appendChild(badge);
    }
    badge.textContent = order;
  }

  function refreshPickBadges() {
    const deckArea = $("#deck-area");
    state.picked.forEach((deckIdx, i) => {
      const el = deckArea.querySelector(`.card[data-idx="${deckIdx}"]`);
      if (el) setPickBadge(el, i + 1);
    });
  }

  function updatePickCount() {
    $("#pick-count").textContent = state.picked.length;
    const confirmBtn = $("#btn-confirm-pick");
    const ready = state.picked.length === 3;
    confirmBtn.disabled = !ready;
    confirmBtn.classList.toggle("ready", ready);
  }

  $("#btn-confirm-pick").addEventListener("click", () => {
    if (state.picked.length !== 3) return;
    goToResult();
  });

  // ============================================
  // 8. SCREEN: RESULT
  // ============================================
  function goToResult() {
    $("#question-echo-2").textContent = "Q. " + state.question;

    // Build triad with randomized orientation + freshness reroll
    state.results = buildTriad(state.picked);

    // Render cards
    const resultCards = $("#result-cards");
    resultCards.innerHTML = "";

    const cardEls = state.results.map((r, i) => {
      const slot = document.createElement("div");
      slot.className = "result-slot";

      const label = document.createElement("div");
      label.className = "position-label";
      label.textContent = POSITIONS[i];

      const cardEl = buildCardEl({
        card: r.card,
        isReversed: r.isReversed,
        flipped: false
      });

      slot.appendChild(label);
      slot.appendChild(cardEl);
      resultCards.appendChild(slot);
      return cardEl;
    });

    // Render per-card interpretations (orientation-aware, varied leads)
    const interpretList = $("#interpret-list");
    interpretList.innerHTML = "";
    state.results.forEach((r, i) => {
      const card = r.card;
      const position = POSITIONS[i];
      const lead = pickLead(position, r.isReversed);
      const keywords = r.isReversed ? card.reversed : card.upright;
      const story = r.isReversed ? card.reversedStory : card.uprightStory;
      const nameTag = card.name + (r.isReversed ? "(역)" : "");

      const div = document.createElement("div");
      div.className = "interpret-card";
      div.innerHTML = `
        <div class="pos-row">
          <span class="pos">${position}</span>
        </div>
        <div class="card-name">${nameTag}</div>
        <div class="card-name-en">${card.nameEn}</div>
        <div class="keywords">${keywords}</div>
        <div class="lead">${lead}</div>
        <div class="prophecy">${story}</div>
      `;
      interpretList.appendChild(div);
    });

    // Build overall prophecy (engine-driven)
    const overall = buildOverallProphecy(state.results, state.question);
    const overallEl = $("#overall-prophecy");
    $("#overall-title").textContent = overall.title;
    $("#overall-body").innerHTML = overall.body;
    $("#overall-advice").innerHTML = overall.advice;
    overallEl.hidden = false;
    overallEl.classList.remove("visible");

    showScreen("result");

    // Animate: flip cards, then fade in interpretations, then overall
    cardEls.forEach((el, i) => {
      setTimeout(() => el.classList.add("flipped"), 350 + i * 500);
    });

    const interpretEls = interpretList.querySelectorAll(".interpret-card");
    const cardsDoneAt = 350 + cardEls.length * 500;
    interpretEls.forEach((el, i) => {
      setTimeout(() => el.classList.add("visible"), cardsDoneAt + i * 250);
    });

    setTimeout(() => {
      overallEl.classList.add("visible");
    }, cardsDoneAt + interpretEls.length * 250 + 200);
  }

  // ============================================
  // 9. OVERALL PROPHECY SYNTHESIS (engine-driven)
  // ============================================
  function buildOverallProphecy(results, question) {
    const a = analyzeTriad(results);
    const domain = detectDomain(question || "");

    // Title: structure first, but tilt to reversed-heavy if 2+ reversed
    let titleKey;
    if (a.reversed >= 2)       titleKey = "reversedHeavy";
    else if (a.majors === 3)   titleKey = "allMajor";
    else if (a.minors === 3)   titleKey = "allMinor";
    else                       titleKey = "mixed";
    const title = RNG.pick(TITLES[titleKey]);

    // Opener by structure
    let openerKey;
    if (a.majors === 3)      openerKey = "allMajor";
    else if (a.minors === 3) openerKey = "allMinor";
    else                     openerKey = "mixed";
    const opener = RNG.pick(OPENERS[openerKey]);

    // Narrative arc through three cards
    const arc = composeArc(results);

    // Element tone line
    const elementLine = RNG.pick(ELEMENT_LINES[a.dominantElement]);

    // Reversed-count modifier
    const reversedLine = REVERSED_LINES[a.reversed];

    // Numerology insight
    const lifepathLine = LIFEPATH_LINES[a.lifePath];

    // Court aside (if any court cards in triad)
    const courtAside = a.courtCount > 0 ? " " + RNG.pick(COURT_ASIDES) : "";

    const body =
      opener + "<br><br>" +
      arc + "<br><br>" +
      elementLine + " " + reversedLine + " " + lifepathLine + courtAside;

    const adviceLine = RNG.pick(DOMAIN_ADVICE[domain] || DOMAIN_ADVICE.general);
    const closer = RNG.pick(CLOSERS);
    const advice = `<strong>조언</strong> — ${adviceLine}<br><br>${closer}`;

    return { title, body, advice };
  }

  // ============================================
  // 10. RESET
  // ============================================
  $("#btn-reset").addEventListener("click", () => {
    state.question = "";
    state.mode = "major";
    state.shuffledDeck = [];
    state.picked = [];
    state.results = [];
    $("#question-input").value = "";
    document.querySelectorAll("#mode-select .mode-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === "major");
    });
    $("#mode-desc").innerHTML = MODE_DESC.major;
    $("#deck-area").innerHTML = "";
    $("#result-cards").innerHTML = "";
    $("#interpret-list").innerHTML = "";
    $("#overall-title").textContent = "";
    $("#overall-body").textContent = "";
    $("#overall-advice").innerHTML = "";
    const overallEl = $("#overall-prophecy");
    overallEl.hidden = true;
    overallEl.classList.remove("visible");
    const confirmBtn = $("#btn-confirm-pick");
    confirmBtn.disabled = true;
    confirmBtn.classList.remove("ready");
    updatePickCount();
    showScreen("intro");
  });
</script>
